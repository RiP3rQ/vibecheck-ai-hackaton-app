services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackaton_ai
      POSTGRES_USER: hackaton
      POSTGRES_PASSWORD: hackaton
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackaton -d hackaton_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
